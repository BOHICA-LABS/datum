# ── Unresolved: recorded rather than guessed ────────────────────────────────
# The registry does not get to pretend it knows what these are. Each needs one question
# answered by whoever wrote it, and a wrong alias here silently mislabels real content.
unresolved:
  consistency-validation-report:
    n: 1
    corpora: {vsdd-factory: 1}
    question: >
      A near-duplicate of `consistency-report` INSIDE THE STANDARD ITSELF — two templates,
      two document_types, one concept. This is a third collision in the 81 alongside
      traceability-matrix/matrices and holdout-evaluation/-report, and it is the only one
      where both spellings have a template and neither is obviously primary.
  feature:
    n: 0
    corpora: {}
    question: "secops-factory has a top-level `feature/` directory; no document_type observed. Directory-only signal."
  phase-f1-delta-analysis:
    n: 0
    corpora: {}
    question: >
      secops-factory has top-level phase-f1-delta-analysis/ and phase-f2-spec-evolution/
      DIRECTORIES — a phase number in a directory name, the same failure mode as
      preflight-findings-iter2. Not measured further; secops-factory has 0 BCs so it was
      excluded from the corpus evidence set.
