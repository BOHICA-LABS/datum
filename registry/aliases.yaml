# aliases.yaml — legacy `document_type` spellings -> canonical, with the field defaults
# that preserve what the spelling was encoding. schema_version: 1
#
# WHY `set:` EXISTS AND WHY A RENAME MAP WOULD BE WRONG.
# The 12 "adversarial review" spellings are not 12 mistakes. `local-adversary-review`,
# `per-story-adversary-review`, `pr-level-security-review` and `gate-step-report` differ
# by SCOPE; `pr-level-security-review` and `pr-level-pr-reviewer-review` differ ONLY by
# REVIEWER. Renaming all of them to `adversarial-review` would silently destroy both
# dimensions. Every alias therefore carries `set:` — the fields the old name was carrying
# in its characters — and migration is a rename PLUS those fields, verified by a count
# assertion per alias.
#
# SCOPE OF THIS FILE, stated because the input plan expected ~12 entries.
# Measured: 181 distinct non-canonical values over 1,138 files. The distribution decides
# the strategy:
#     108 values appear exactly once ...........  108 files  ( 9.5% of the mass)
#      48 values appear 2-5 times .............   131 files  (11.5%)
#      13 values appear 6-20 times ............   116 files  (10.2%)
#      10 values appear 21-100 times ..........   416 files  (36.6%)
#       2 values appear >100 times ............   367 files  (32.2%)
# So 12 values carry 783 of 1,138 files. This file aliases the HEAD (everything >=2
# files, plus every singleton that is an obvious respelling of a canonical type). The
# remaining singletons are NOT aliased: they are handled by the closed-enum gate, which
# is the correct instrument for one-off invention. Aliasing 108 singletons would encode
# the drift permanently under the appearance of fixing it.
#
# RETIREMENT. An alias is a MIGRATION AND HISTORY device, not a permanent tolerance.
# Each entry carries `retire_after`, and history keeps resolving through it forever —
# historical documents must stay valid (PROBE-CYCLES §5 found BC-1.12.008 was
# LEGITIMATELY renumbered to BC-3.05.004, so a flat existence check against today's
# corpus manufactures false findings against correct documents).

version: 1
retire_after_default: "the type's finding baseline reaches zero and enforcement_level is block"

# ── The review family: 425 files, 11 spellings, one canonical type ────────────
