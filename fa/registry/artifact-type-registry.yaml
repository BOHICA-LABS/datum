  # ─────────────── Ledgers: the append-only shape, and why it matters ─────────
  # PROBE-CYCLES measured that cycles/ is THREE shapes, not one: ~568 of 611 files are
  # touched by exactly ONE commit (immutable, cannot conflict), the churn is NINE
  # append-only ledgers, and INDEX.md is derived. Corpus-wide confirmation: of the 16
  # paths with >50 commits, every single one is a derived index or one of these ledgers.
  # Storing a ledger as a document is what makes burst-log.md collide; storing it as rows
  # makes concurrent appends structurally unable to conflict.
  burst-log:
    family: ledger
    profile: core
    shape: append-only-event
    authority: authored
    key: [cycle, entry_id]
    key_format: "D-{seq}"
    path_registry_type: cycle-document
    required+: [cycle, entry_id, entry_date]
    optional+: [related_sha, related_story]
    enums: {status: status, level: level, producer: producer}
    links: {traces_to: traces_to, inputs: inputs, related_story: story_id}
    section_policy: free
    gate_severity: error
    enforcement_level: advisory
    enforcement_target: block
    evidence: >
      n=7 typed files but 133 / 105 / 63 commits on three of them — the highest-churn
      prose files in the corpus. Entries are already enumerable as `D-NNN` headings
      (D-524, D-520, D-519 … measured in the H2 index), so the row model is a
      transcription, not a redesign.
    notes: >
      ONE ROW PER D-NNN ENTRY. This is the type that most justifies the whole exercise:
      301 commits across three files, every one an append, every one currently a
      whole-document rewrite that can conflict. As rows they cannot.

  cycle-decision-log:
    namespace_status: template_missing
    family: ledger
    profile: core
    shape: append-only-event
    authority: authored
    key: [cycle, decision_id]
    key_format: "D-{seq}"
