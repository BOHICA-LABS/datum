    required+: []
    enums: {status: status, severity_max: severity_max, producer: producer}
    section_policy: expected
    gate_severity: info
    enforcement_level: advisory
    pending_template: true
    evidence: >
      8 prism files across 4 spellings: preflight-findings 4, preflight-findings-iter2 2,
