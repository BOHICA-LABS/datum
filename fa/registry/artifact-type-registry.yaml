  # ───────────────────── Reviews: ONE type, four dimensions ──────────────────
  # This is the single largest consolidation in the registry. 15 spellings over 1,150
  # files collapse to THREE canonical types — adversarial-review, code-review,
  # security-review — discriminated by the fields the spellings were encoding:
  #   scope         spec | story | pr | wave-gate | cycle | corpus
  #   reviewer_role adversary | pr-reviewer | code-reviewer | security-reviewer | ...
  #   pass          the pass number
  #   cycle         the cycle it belongs to
  # Aliases in aliases.yaml therefore carry `set:` defaults; a rename alone would
  # destroy the dimension the name was carrying.
  adversarial-review:
    family: review
    profile: core
    shape: document
    authority: authored
    key: [cycle, scope, target, pass]
    path_registry_type: adversarial-review
    required+: [cycle, scope, pass, reviewer_role, gate_result, convergence, severity_max, finding_count]
