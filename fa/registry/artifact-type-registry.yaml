# artifact-type-registry.yaml — THE canonical artifact type registry. schema_version: 1
#
# WHAT THIS IS. `artifact-path-registry.yaml` (ADR-016) declares WHERE an artifact
# lives. It stops one level short of WHAT an artifact IS. This file declares, per type:
#   key · required fields · enums · link types · section schema · shape · authority ·
#   gate severity · enforcement level · profile membership
# so that `fa` can validate an artifact rather than only its path.
#
# STATUS: PROPOSED. Not adopted. Nothing in ~/Dev/vsdd-factory or any sibling corpus was
# modified to produce it. Adoption runs through change management — see
# registry/CHANGE-MANAGEMENT.md (ADR + stories + a policy with enforced_by).
#
# ── HOW THIS WAS DERIVED (so no reviewer has to take it on trust) ──────────────
# Seeded from the 81 distinct `document_type` values declared in
# plugins/vsdd-factory/templates/, then cross-checked against ACTUAL usage in THREE
# corpora — vsdd-factory, prism and rivetry. Never vsdd alone: it is a 7.2x-BC outlier
# whose own holdout-evaluations/ is uniquely named AND empty (CROSS-CORPUS §6).
# Every `evidence:` line is a measured count. Regenerate with:
#   python3 registry/measure_types.py && python3 registry/observe.py
#   python3 registry/validate_registry.py
#
# ── FIVE MEASURED FINDINGS THAT SHAPED THE DESIGN ─────────────────────────────
# 1. THERE ARE TWO DECLARED STANDARDS, NOT ONE. artifact-path-registry.yaml declares 46
#    `artifact_type` names; templates/ declares 81 `document_type` names; only ELEVEN
#    appear in both. 8 registry-only names are in live use as document_type values
#    (proposal, cycle-index, cycle-decision-log, code-delivery-artifact, po-obligations,
#    verification-property-index, behavioral-contract-index, feature-delta-analysis), so
#    a template-only gate would flag them as drift. Reconciling the two namespaces is
#    THE precondition of enforcement; `path_registry_type:` records the mapping and
#    `namespace_status:` marks what KIND of disagreement each is. Measured, and note the
#    correction: an earlier cut of this file used ONE boolean for three unrelated defects
#    and so reported "17 namespace defects". The real split is
#    name_disagreement 2 · path_missing 4 · template_missing 11, and only the first two
#    are namespace defects at all. See `namespace_reconciliation` below.
# 2. IT IS AN ENFORCEMENT GAP BY MASS AND A DESIGN GAP BY VOCABULARY. Canonical values
#    cover 91% (vsdd) / 65% (prism) / 57% (rivetry) of typed files, but only 22 of 71 /
#    32 of 150 / 27 of 51 DISTINCT values. 181 non-canonical values over 1,138 files.
# 3. THE DRIFT TAIL IS SINGLETONS. Of those 181 values, 108 appear exactly once (108
#    files) while the top 12 carry 783 of the 1,138. Consequence: alias the head, and
#    gate the tail with a closed enum. An alias map for 181 values would be theatre.
# 4. THE 12 "ADVERSARIAL REVIEW" SPELLINGS ENCODE REAL DIMENSIONS. local-, per-story-,
#    pr-level-, gate-step- differ by SCOPE, and pr-level-security-review vs
#    pr-level-pr-reviewer-review differ ONLY by REVIEWER. A rename-only alias destroys
#    that information, so every alias in aliases.yaml carries `set:` field defaults.
# 5. TWO TYPES EXIST ONLY BECAUSE THERE IS NO VERSIONED STORE, and are RETIRED here:
#    `delta-archive` (211 rivetry files — hand-rotated changelog sidecars created by
#    rivetry's own POLICY-22, carrying source_file + source_document_type) and the
#    `input-hash` field (3,890 files across the three corpora — a hand-maintained
#    content hash whose own archive text admits it reports "spurious DRIFT" under
#    cascading recomputes). Both are `dolt_history_*` / derived in `fa`.
#
# ── THE FOUR SETTLED ONE-WAY DOORS (user, 2026-07-31) ─────────────────────────
# D-A  PROSE UNIT: verbatim `body` bytes + a DERIVED ordinal-keyed section partition,
#      with concat(sections) == body enforced byte-exact. Measured 0 mismatches over
#      6,537 markdown files, so the partition is provably lossless. Sections are keyed
#      by ORDINAL, never heading: 110 docs carry 1,968 duplicate `##`+ headings.
# D-B  STORE: gitignored, synced via refs/dolt/data on the same git remote. Rendered
#      markdown stays COMMITTED as the review surface and the offline backup, which
#      requires new INVARIANT 15: import(render(store)) == store, gated in CI.
# D-C  KEY: per-type declared natural key; `path` retained as a UNIQUE DERIVED column,
#      never identity (measured: 1,852 BC renames, 0 deletes — nearly every BC has
#      moved); plus an id_alias ledger so renumbering (BC-1.12.008 -> BC-3.05.004) keeps
#      history valid instead of manufacturing false dangling-ref findings.
# D-D  VERDICT: `verdict` is retired and split into gate_result / convergence /
#      severity_max. The outcome field is `gate_result`, NOT `gate`: `gate` is already
#      in live use in prism as an identifier (`gate: wave-3-integration-gate`, beside
#      gate_step / gate_step_name). `status` is likewise narrowed to LIFECYCLE ONLY.

version: 1
enums_file: enums.yaml
aliases_file: aliases.yaml

# ── Profiles: product variation is a SUBSET, not a dialect ────────────────────
# A project declares WHICH canonical types it uses. It never declares its own names for
# them. This is where product-type variation lives, and it is measured: rivetry (CAD/PCB
# SaaS with a UI) grows design-system / ui-evidence / storyboard / specs{brand,ux};
# prism (security MCP server) grows test-strategy / security-review / remediation
# artifacts. Both vocabularies are ALREADY canonical or become canonical here — the
# products differ in subset, exactly as predicted.
profiles:
  core:
    description: >
      Required of every VSDD project. Membership test: does the type have a MERGE-SAFETY
      or TRACEABILITY consequence? "Append-only ledger vs mutable record" is universal;
      "does this product need a threat model" is not.
    evidence: >
      CROSS-CORPUS §2 — non-empty dirs across 10 corpora: cycles 10/10, specs 10/10,
      logs 9/10, planning 8/10, code-delivery 7/10, stories 7/10. IDs: BC-S.SS.NNN 11/12,
      ADR-NNN 8/12, VP-NNN 6/12.
  ui:
    description: Products with a human interface.
    evidence: "rivetry only, of 10 corpora: ux-spec-* 38 files, design-system, storyboard, brand"
    example_projects: [rivetry]
  security:
    description: Products whose threat model is a first-class deliverable.
    evidence: "prism: security-review 9, pr-level-security-review 8, remediation-manifest 31, test-strategy 1"
    example_projects: [prism]
  brownfield:
    description: Projects ingesting an existing codebase.
    evidence: "semport non-empty in 4/10 corpora; phase-0-ingestion in 3/10"
    example_projects: [vsdd-factory, prism, corverax]
  discovery:
    description: Projects running the opportunity-discovery engine rather than a fixed brief.
    evidence: "idea-brief / discovery-report / feature-request declared in templates, 0 files in all 3 corpora"

# ── The shared frontmatter spine ───────────────────────────────────────────────
# Declared by the templates themselves, not invented here: of the 79 templates carrying
# frontmatter, document_type 79, status 70, producer 67, timestamp 65, version 65,
# traces_to 62, level 59, phase 59, inputs 58. Each row below declares only its DELTA.
defaults:
  required:
    - document_type   # 79/79 templates. The type discriminator; must be a canonical value.
    - status          # 70/79. LIFECYCLE ONLY (enum: status). See D-D.
    - producer        # 67/79. enum: producer (open_extension).
    - timestamp       # 65/79. RFC3339. Derived on write; never hand-set.
    - version         # 65/79. Monotonic per key. Derived from the store, not authored.
  optional:
    - traces_to       # 62/79. enum-checked LINK, see link_types.
    - level           # 59/79. enum: level.
    - phase           # 59/79. free string — measured NOT closed (vsdd alone: 1.4b, 0d,
                      #   2-re-anchor, F5, per-story-step-4-local-adversary-cascade).
    - inputs          # 58/79. LINK list. Feeds the derived staleness check.
    - producer_note   # NEW. Absorbs the parenthetical prose measured in 48 prism
                      #   `producer` values, keeping `producer` a clean enum.
  key_source_note: >
    MEASURED, AND IT CORRECTED THIS REGISTRY. A type's key component is often NOT a
    frontmatter field today — BC files carry subsystem/capability/lifecycle_status but no
    `bc_id`, and VP files carry no `vp_id`; the id exists only in the FILENAME. Declaring
    those keys `required` generated 2,272 false findings on correct files. So each row may
    declare `key_source: filename` and the gate treats it as a ONE-TIME MIGRATION step
    (materialise the id into the record on import, which is what `fa import` already does)
    rather than as a per-file authoring defect. This is also why the id must move INTO the
    store: while it lives only in the path, the 1,852 measured renames are silent identity
    changes.
  enforcement_point: both
  # TAKEN FROM #671, which puts its gate in factory-dispatcher hooks rather than in CI.
  # Not a detail: CI catches drift AFTER the fact, when the authoring agent's context is
  # gone, so it REPORTS rather than SHAPES. A PreToolUse hook refuses the write while the
  # agent can still fix it, and it reuses an enforcement surface that already exists.
  # It also explains how the drift got this far: artifact-path-registry.yaml's own header
  # claims "the hook always blocks writes to .factory/ paths that match NO entry", yet 151
  # prism files sit in 4 undeclared specs/ subdirectories. A claimed hook that does not run
  # is worth less than no hook, because it is trusted.
  # CONSTRAINT (enums.yaml): a type at enforcement_level: block MUST be enforced at `write`
  # or `both`. `block` enforced only in CI is a contradiction — the write already happened.
  shape_overrides:
    config:         {required: [document_type], note: "policies.yaml / release-config.yaml carry no status or producer, correctly"}
    blob-with-path: {required: [document_type], note: "opaque bytes; fa models the path, not the content"}
  derived_never_authored:
    - version         # from the store's own history
    - timestamp       # from the commit
    - input-hash      # RETIRED as a stored field. 3,890 files carry it today; it is a
                      #   hand-maintained content hash that admits to false DRIFT.
                      #   `fa` computes staleness from `inputs` + history.
    - path            # UNIQUE, derived from key + type. Never identity (D-C).
    - section         # the ordinal partition of body (D-A)
  forbidden:
    - verdict         # RETIRED -> gate_result / convergence / severity_max (D-D)
    - delta           # RETIRED -> store history. Observed on ux-spec-flow/screen (38 files).
    - changelog       # RETIRED -> store history. A `## Changelog` SECTION is likewise
                      #   retired: measured on adr, verification-property,
                      #   architecture-section, domain-spec-section, cycle-manifest,
                      #   persona-journey-map and more.

# ── Link types: what a reference is allowed to point AT ───────────────────────
# The corpus has 1,509 frontmatter edges and 39 dangling references that no gate catches
# today. A link is only checkable if its target UNIVERSE is declared, which is what this
# section does. Universes come from authoritative declaring documents only — never from
# grep-over-everything, or every reference resolves trivially and the check proves
# nothing.
link_types:
  # `pin_policy` is TAKEN FROM #671 and is the field that makes version cites checkable.
  # See enums.yaml: floating (must be current) · pinned (deliberately historical) ·
  # as_of (resolve at the citing document's own version). Declaring it per link type is
  # what stops a prose extractor reporting a correct historical citation as drift.
  traces_to:
    targets: [capability, domain_invariant, nfr, fr, adr, behavioral-contract, verification-property, epic, prd]
    cardinality: list
    pin_policy: as_of        # resolve through id_alias at the document's own version
  verified_by:      {targets: [verification-property], cardinality: list, pin_policy: as_of}
  behavioral_contracts: {targets: [behavioral-contract], cardinality: list, pin_policy: as_of}
  verification_properties: {targets: [verification-property], cardinality: list, pin_policy: as_of}
  depends_on:       {targets: [story], cardinality: list, pin_policy: as_of, symmetric_with: blocks}
  blocks:           {targets: [story], cardinality: list, pin_policy: as_of, symmetric_with: depends_on}
  supersedes:       {targets: [adr], cardinality: list, pin_policy: as_of, symmetric_with: superseded_by}
  superseded_by:    {targets: [adr], cardinality: scalar, pin_policy: as_of, symmetric_with: supersedes}
  subsystems:       {targets: [subsystem], cardinality: list, pin_policy: floating}
  subsystems_affected: {targets: [subsystem], cardinality: list, pin_policy: as_of}
  epic_id:          {targets: [epic], cardinality: scalar, pin_policy: floating}
  story_id:         {targets: [story], cardinality: scalar, pin_policy: floating}
  capability:       {targets: [capability], cardinality: scalar, pin_policy: floating}
  prd_capabilities: {targets: [capability], cardinality: list, pin_policy: as_of}
  prd_requirements: {targets: [fr, nfr], cardinality: list, pin_policy: as_of}
  inputs:           {targets: [any_artifact], cardinality: list, pin_policy: floating, note: "feeds derived staleness"}
  previous_review:  {targets: [adversarial-review], cardinality: scalar, pin_policy: pinned}
  source_bc:        {targets: [behavioral-contract], cardinality: scalar, pin_policy: as_of}
  module:           {targets: [module], cardinality: scalar, pin_policy: floating}
  screens:          {targets: [ux-spec-screen], cardinality: list, pin_policy: floating}
  replacement:      {targets: [behavioral-contract, verification-property], cardinality: scalar, pin_policy: floating}
  # ── the version-cite links #671 exists to police ───────────────────────────
  index_cite:
    targets: [behavioral-contract-index, verification-property-index, story-index, architecture-index]
    cardinality: list
    pin_policy: floating
    carries_version: true
    note: >
      An INDEX citing a sibling INDEX's version (`per BC-INDEX v1.25`). floating, so a lag
      IS a finding — measured: `ARCH-INDEX cite "per BC-INDEX v1.25" lags actual v1.26`.
      This is the 4-index version-cite ledger that `validate-index-cite-refresh` polices by
      string scanning today, and the reason #671 was written.
  reviewed_version:
    targets: [any_artifact]
    cardinality: list
    pin_policy: pinned
    carries_version: true
    note: >
      What a review/finding/checkpoint SAW. pinned, so lag is CORRECT and must never be
      reported. Same syntax as index_cite, opposite verdict — which is exactly why the
      policy has to be declared rather than inferred from the text.

# Rules that apply to ALL link types. Hoisted out of `link_types` because a rules LIST
# sitting beside entry MAPS made the block untypeable — Go's map[string]*LinkType could not
# unmarshal it, and the failure surfaced as a nil dereference in a test that had discarded
# the error. A schema that only one of two readers can parse is the defect this file exists
# to prevent.
link_rules:
    - "A link field holds IDs ONLY. Measured violations `fa validate` already reports:
       16 `VP.scope is multi-valued`, 8 `VP.bcs holds an id plus prose`, 7 `VP.bcs value
       is not an id`, 4 `story.functional_requirements not an id`, 2 `bc.replacement
       holds prose`, plus `see PO output for actual IDs` sitting in a traceability field."
    - "A symmetric_with pair is stored ONCE and the reverse direction is DERIVED. The 58
       `direction` findings in fa's baseline are one class with one fix: store a single
       dependency direction, not 58 corrected entries."
    - "A link that `carries_version: true` is checked against its pin_policy, NEVER against
       today's corpus alone. floating + lagging = finding. pinned + lagging = correct.
       pinned + a version that NEVER EXISTED = finding in either case, and that check is
       only possible because the store keeps history."
    - "A pin_policy MUST be declared. An undeclared policy defaults to `as_of`, which is
       the SAFE default: it can under-report, but it cannot manufacture a finding against a
       correct historical document."

# ── Query verbs: the agent-facing surface ────────────────────────────────────
# Settled by measurement, not preference (STANDARDIZATION §4): SQL already does every hard
# part — recursive CTEs for cycle detection and transitive closure (26,130 paths), a
# whole-corpus 4-hop rollup in 3 ms, FULLTEXT over 1,959 bodies in 0.15 s. So the question
# was never the language, it is WHO QUERIES HOLDING WHAT. An LLM composing joins across 25
# tables returns plausible-but-wrong answers with NO error — the exact failure class this
# project exists to eliminate. Agents therefore get named verbs with stable JSON output:
# testable contracts, gateable per zone, stable across schema change.
#
# Accepted cost: every new question needs a new verb. That is a feature — it forces each
# query to be named, tested and baselined — but it needs an explicit "how to add a verb"
# path or people route around it via `fa sql`.
query_verbs:
  built:
    count:    "records and derived counts, never stored"
    validate: "every gate as a query, incl. the registry gate"
    doctor:   "store health: writable (not merely openable), unmerged, schema, imported"
    waves:    "topological wave schedule from story depends_on — longest-path layering, refuses on a cycle"
    graph:    "build | metrics | dot | diff over the gonum projection (see research/GRAPH-PERF.md)"
  phase_2:
    get:      {returns: "one artifact by key", note: "the base case"}
    trace:    {returns: "the forward closure from an artifact", note: "what does this touch"}
    coverage: {returns: "verification coverage per BC/subsystem", note: "measured: 90.2% of BCs have no verifying VP"}
    history:  {returns: "every version of one key", note: "dolt_history_*; retires delta-archive's 211 hand-rotated files"}
    asof:     {returns: "the corpus as of a commit/date", note: "what makes a pinned cite checkable"}
    diff:     {returns: "a unified diff between two versions", note: "~50 lines over from_body/to_body; the PR review surface"}
    impact:
      returns: "the REVERSE closure — every artifact that must change if this one changes"
      taken_from: "#671"
      why: >
        TAKEN FROM #671, and the verb the adversary actually needs. `trace`/`coverage`
        answer "what does this touch"; `impact` answers the inverse, which is the question
        behind the propagation misses the adversary keeps reporting: a VP count widened in
        one place and not its three siblings; `module-criticality` updated without
        `verification-coverage-matrix`; "F-P27-005 closure incomplete — VP-INDEX harmonized,
        source VP files NOT updated". Every one of those is a missing reverse-closure query.
      note: >
        Cheap here and expensive in #671's design: the reverse closure is one recursive CTE
        over the edge table, where an in-memory graph rebuilt per invocation must re-parse
        the whole corpus to answer it.
    # `waves` and `impact` moved: waves is BUILT (above); impact stays phase 2 and stays in
    # SQL, because reverse closure is one recursive CTE and the projection would add nothing.
  how_to_add_a_verb: >
    A verb enters by: a named entry here, a declared JSON output schema, a test with a
    fixture corpus, and a baseline entry if it produces findings. `fa sql --read-only`
    stays available for exploration precisely so nobody has to fake a verb to ask a
    one-off question.

# ── Namespace reconciliation (story 1) ───────────────────────────────────────
# artifact-path-registry.yaml declares 46 `artifact_type` names; this file declares the
# `document_type` names agents actually write. They overlap on ELEVEN. This section is the
# single mapping a migration script reads, and it exists because a mapping kept in two
# heads is the defect being fixed.
#
# ⚠ CORRECTION TO THIS REGISTRY'S OWN FIRST CUT. One boolean
# `registry_namespace_defect: true` stood for THREE unrelated defects, which overstated the
# disagreement as 17. Measured, they are:
#     name_disagreement  2   genuinely two names for one concept
#     path_missing       4   a template declares the type; the path registry does not
#     template_missing  11   the path registry declares it; no template does
# Only the FIRST two are namespace defects. `template_missing` is a template gap and folds
# into story 2. Per-type this is now `namespace_status:` rather than a boolean.
namespace_reconciliation:
  resolution_rule: >
    The `document_type` name WINS, because it is the value agents write into 3,000+ files
    and the value every gate reads. The path-registry name becomes a recorded alias in the
    PATH namespace, never a second spelling of the type.

  name_disagreements:
    - document_type: story
      path_registry_type: story-spec
      winner: story
      why: >
        `story` is what 369 files across two corpora actually declare, and what
        story-template.md declares. `story-spec` appears in no file's frontmatter.
      action: "rename the path-registry entry to `story`; keep `story-spec` as a path alias for one release"
    - document_type: pipeline-state
      path_registry_type: state
      winner: pipeline-state
      why: >
        `pipeline-state` is template-declared (state-template.md) and present in all three
        corpora. `state` is too generic to survive next to state-runtime-{wave,regression,adversary}.
      action: "rename the path-registry entry to `pipeline-state`"

  path_missing:            # a template declares the type; the path registry never did
    - {document_type: product-brief,                  path: ".factory/specs/product-brief.md", evidence: "measured: specs/ (1 file)"}
    - {document_type: architecture,                   path: ".factory/specs/architecture/{filename}.md", evidence: "measured: specs/architecture (3 rivetry files)"}
    - {document_type: prd-supplement-error-taxonomy,  path: ".factory/specs/prd-supplements/{filename}.md", evidence: "measured: specs/prd-supplements/, non-empty in 9/12 candidates"}
    - {document_type: holdout-scenario,               path: ".factory/holdout-scenarios/HS-{seq}-{slug}.md", evidence: "measured: holdout-scenarios/ (21 prism files, HS-N-{slug}.md)"}
    # ^ THE DIRECTORY DEFECT. The path registry declares ONLY
    #   .factory/holdout-evaluations/{filename}.md — the spelling that appears in 1 plugin
    #   file, against `holdout-scenarios` in 48, and vsdd's own holdout-evaluations/ holds
    #   nothing but a .gitkeep. The path registry codified the 1 over the 48.

  template_missing:        # the path registry declares it; NO template does -> story 2
    - behavioral-contract-index
    - behavioral-contract-id-mapping
    - verification-property-index
    - cycle-index
    - cycle-decision-log
    - code-delivery-artifact
    - po-obligations
    - proposal              # and it is the ONE path-registry entry that already does schema
    - spec-open-questions
    - sprint-state
    - story-id-mapping

  shared_path_patterns:    # NOT a defect: the path registry is deliberately COARSER
    - path_registry_type: cycle-document
      pattern: ".factory/cycles/{cycle-id}/{filename}.md"
      serves: [burst-log, lessons-learned, cycle-manifest, session-checkpoints, adversarial-review, consistency-report, security-review, code-review]
      note: >
        One pattern legitimately serves many types. So a merged registry must NOT require
        a unique path per type — that was the naive reading of "merge the two files", and
        it would have forced 8 invented sub-directories.
    - path_registry_type: code-delivery-story-artifact
      pattern: ".factory/code-delivery/{story-id}/{filename}.md"
      serves: [pr-review-findings, pr-description, merge-result, red-gate-log]
    - path_registry_type: domain-spec
      pattern: ".factory/specs/domain-spec/{filename}.md"
      serves: [domain-spec, domain-spec-section, domain-spec-index]

  path_registry_only:      # declared paths with no type row; disposition each
    - artifact_type: per-story-adversary-pass
      disposition: "resolves to adversarial-review with scope: story — see aliases.yaml"
    - artifact_type: state-runtime-adversary
      disposition: "runtime state, shape config, authority derived; convergence is recomputable from adversarial-finding rows"
    - artifact_type: plan-doc
      disposition: "the `planning`/`plans` directory split (8 corpora vs 2, CROSS-CORPUS §4). Canonical dir: planning/. Serves dispatch-package."
    - artifact_type: feature-delta-analysis
      disposition: "aliases to delta-analysis-report — the template and the path registry chose different names for one artifact"

  exit_criterion: "zero types with namespace_status: name_disagreement after the two renames land"

# ── Prose references: sub-artifact ids that live in document BODIES ──────────
# ADDED after running #671's exit criterion (research/FSTAR-COMPARISON.md). Measured on a
# hand-classified random sample of the adversary's own findings: 21.8% (+/-8.7) require
# reading BODY PROSE, not frontmatter. That is too large to leave out, so the capability is
# declared here. For scale, the class the registry ALREADY eliminates by making indexes
# derived is 25.3% (+/-9.1) — so this addition is second in value, not first.
#
# These ids are FILE-SCOPED, not globally unique: AC-002 exists in many stories. Their key
# is therefore (owning_artifact_key, id) — the same composite-key discipline D-C applies to
# documents. And because D-A stores an addressable section partition, a prose reference
# resolves to (doc_key, section_ord), so a finding can name the SECTION it lives in rather
# than a 615 KB document.
#
# ⚠ THREE DEFECTS WERE MEASURED IN THIS BLOCK ON 2026-08-01 AND ARE FIXED BELOW. All three were
# found by running it against the corpus rather than by reading it — see
# research/PROSE-REFS-OR-FIELDS.md.
#
#   1. THE PATTERNS WERE UNANCHORED. `D-\d+` matched `D-074` inside `TD-074` and `D-069` inside
#      `TD-VSDD-069`. Over-match: 9,755 candidates, and `t_task` was 73% NOISE (6,565 -> 1,733).
#      Every pattern now carries the shared `boundary` guard, asserted by validate_registry.py.
#   2. THE KIND LIST WAS INCOMPLETE by ~22,750 genuine reference forms over 1,585 distinct
#      spellings, with the top 20 covering only 55%. The head is now declared (below); the tail
#      is deliberately NOT, on the same evidence-backed strategy as the 181 non-canonical
#      document_type values: alias the head, GATE the tail. A pattern per singleton would be
#      theatre.
#   3. `version_cite` SAW 2.4% OF ITS OWN SUBJECT. Requiring a `per|see|against` preposition
#      matched 39 cites against 1,612 written as a plain `NAME vX.Y`. That is a 41x undercount
#      of exactly the thing `pin_policy` was declared for.
#
# `boundary` is applied by the READER, not repeated in every pattern: one place to fix, and a
# pattern that forgets it cannot silently ship.
prose_ref_boundary:
  before: '(?<![A-Za-z0-9-])'
  after:  '(?![A-Za-z0-9])'
  note: >
    Wrapped around every kind's pattern. `before` rejects a preceding letter, digit or hyphen so
    `TD-074` cannot yield `D-074`; `after` rejects a trailing alphanumeric so `D-41` cannot be
    read out of `D-413`. Measured cost of omitting it: 9,755 false candidates.

prose_ref_kinds:
  ac:      {pattern: 'AC-\d+[a-z]?',  scope: file, owner_types: [story, epic], note: "acceptance criterion; the optional letter is real — AC-002a is cited in the corpus"}
  ec:      {pattern: 'EC-\d+',      scope: file, owner_types: [behavioral-contract], note: "edge case"}
  pc:      {pattern: 'PC-?\d+',     scope: file, owner_types: [behavioral-contract], note: "precondition"}
  section: {pattern: '§[^,;)]+',    scope: file, owner_types: [any_artifact]}
  t_task:  {pattern: 'T-\d+',       scope: file, owner_types: [story], note: "task"}
  finding: {pattern: 'F-(?:[A-Za-z0-9]+-)*\d+', scope: cycle, owner_types: [adversarial-review], note: "see adversarial-finding. The prefix group is OPTIONAL: a two-segment-minimum form missed the bare F-7 (752 refs remained after the first widening) while still matching F-SP8-001 and F-S808-P2-001"}
  decision: {pattern: 'D-\d+(?:\.\d+)*(?:\([a-z]\))?', scope: cycle, owner_types: [cycle-decision-log, burst-log], note: "the dotted D-1.2 form is 793 refs; the D-426(a) sub-clause form is cited as a unit"}
  lesson:  {pattern: 'L-[A-Za-z0-9]*-?\d+', scope: cycle, owner_types: [lessons-learned]}
  policy:  {pattern: 'POL(?:ICY)?[- ]\d+', scope: project, owner_types: [policies]}

  # ── the undeclared HEAD, now declared (defect 2) ────────────────────────────
  tech_debt:
    pattern: 'TD(?:-VSDD)?-\d+'
    scope: project
    owner_types: [tech-debt-register]
    note: "2,224 refs. The register is one file, so scope is project, not cycle."
  bc_audit:
    pattern: 'BC-AUDIT(?:-\d+)?'
    scope: project
    owner_types: [any_artifact]
    note: "3,863 refs (3,094 numbered + 769 bare). Marks a BC audit pass."
  meta_level:
    pattern: 'META-LEVEL(?:-\d+)?'
    scope: project
    owner_types: [policies, lessons-learned]
    note: "1,073 refs. POLICY 5 was extended SIX times as META-LEVEL 31..36."
  invariant:
    pattern: '[Ii][Nn][Vv]-\d+'
    scope: file
    owner_types: [behavioral-contract, domain-spec-invariants]
    note: "726 refs, the census head after the first four kinds landed. Case-insensitive because the corpus writes both INV-4 and inv-4."
  bc_family:
    pattern: 'BC-\d+\.\d+'
    scope: project
    owner_types: [behavioral-contract]
    note: >
      893 refs. A PARTIAL BC id naming a sub-family (BC-7.03) rather than one contract. It is a
      reference to a SET, so it resolves iff at least one BC-7.03.* exists — a different
      resolution rule from a full id, which is why it is its own kind rather than a looser `bc`.

  version_cite:
    # Two forms, both measured. The prepositional form is kept as the STRICT signal; the plain
    # form is what the corpus actually writes 41x more often.
    pattern: '\b([A-Z][A-Z0-9-]{2,}(?:-INDEX)?(?:\.md)?)\s+v(\d+\.\d+)'
    pattern_prepositional: '(?:per|see|against)\s+([A-Z][A-Z0-9-]{2,}(?:-INDEX)?(?:\.md)?)\s+v(\d+\.\d+)'
    scope: project
    owner_types: [any_artifact]
    carries_version: true
    pin_policy_from: link_type   # index_cite -> floating · reviewed_version -> pinned
    measured: "39 prepositional · 1,612 plain, over 2,768 documents"
    note: >
      TAKEN FROM #671. The prose form of a version cite. Extracting it is only safe once
      pin_policy is declared, which is why this kind exists here and not in the first cut.

prose_ref_rules:
  - id: exclude-code-spans
    rule: >
      A candidate id inside a backtick span, fenced block or link target is NOT a reference.
      MEASURED: `ADR-099` appears as an example CLI argument in a code span, and a flat scan
      reports it as dangling — a false finding against a correct document (PROBE-CYCLES §5).
  - id: resolve-as-of
    rule: >
      Resolve every id through `id_alias` at the citing document's own version, never against
      today's corpus. MEASURED: BC-1.12.008 was LEGITIMATELY renumbered to BC-3.05.004, so a
      flat existence check manufactures findings against correct history.
  - id: scope-sub-artifact-ids
    rule: >
      AC-002 is not globally unique. Key is (owning_artifact_key, id). A cross-document
      citation of a sub-artifact id must name its owner or it is unresolvable, and reporting
      it as dangling would be the checker's defect, not the document's.
  - id: section-scoped-counts
    rule: >
      A count field is scoped to its declared section. MEASURED: `finding_count: 0` is
      CORRECT in a document whose `### O-001` headings sit under "Part B — Observations
      (non-finding)", so a body-wide count manufactures a false finding.
  - id: pin-policy-decides-the-verdict
    rule: >
      A version cite is judged by its link's pin_policy, not by whether it matches today.
      floating + lagging is a finding; pinned + lagging is CORRECT and reporting it is the
      checker's defect. Measured evidence on both sides: `ARCH-INDEX cite "per BC-INDEX
      v1.25" lags actual v1.26` is a real finding, while a pass-74 review citing the
      4-index state it reviewed is not.
  - id: pinned-to-a-version-that-never-existed
    rule: >
      Regardless of pin_policy, a cite naming a version the target never had IS a finding.
      This check requires HISTORY, so it is one a markdown-only checker cannot make — the
      clearest case where the store earns its keep over #671's rehydrate-per-invocation graph.
  - id: a-declared-gap-is-not-a-trace
    rule: >
      A trace cell that MARKS ITSELF as a gap is not asserting a reference to an existing
      artifact. Markers measured in the corpus: `[process-gap]`, "v1.1 candidate", "uncontracted",
      "BC candidate", "proposed".
      MEASURED: S-0.02's AC-1 trace reads "[process-gap] (Release.yml prerelease:true flag
      emission is uncontracted by SS-09 BCs; v1.1 candidate BC-10.13.012-...)". Treating that as
      a trace produced 55 POLICY-8 findings and 50 dangling-trace findings that BLAME THE
      DOCUMENT FOR CORRECTLY DOCUMENTING A GAP — 50 of 53 of the entire dangling class. Same
      shape as section-scoped-counts: a count of 0 is correct under a "non-finding" heading.
  - id: an-id-with-a-name-suffix-is-a-proposed-NAME
    rule: >
      `BC-10.13.012-release-yml-prerelease-flag-emission` is a PROPOSED NAME for a contract that
      does not exist, not a reference to `BC-10.13.012`. prose_ref_boundary's `after` guard
      permits a following hyphen (correctly — `D-426(a)` and `BC-7.03` need it), so a full id
      followed by `-<word>` needs its own rule. Without it the suffix form was read as a
      reference in every one of the 40 cells that carry both this and a gap marker.
  - id: report-unresolvable-separately
    rule: >
      An id that cannot be resolved because its OWNER is unstated is reported as
      `unresolvable`, never as `dangling`. Collapsing the two is how a prose extractor
      produces a large, confident, wrong finding set.


# ── Section schema policy ─────────────────────────────────────────────────────
section_policies:
  required_ordered:
    note: Every listed section must be present, in order. Extra sections are a finding.
  required_unordered:
    note: Every listed section must be present. Order and extras are free.
  expected:
    note: Listed sections are warned-on when absent. The default for review documents.
  free:
    note: No section schema. Correct for ledgers and ingested material.

# ═══════════════════════════════════════════════════════════════════════════════
# TYPES
# ═══════════════════════════════════════════════════════════════════════════════
# Row fields: family · profile · shape · authority · key · path_registry_type ·
# required+ (delta beyond defaults) · optional+ · enums · links · sections ·
# section_policy · gate_severity · enforcement_level · evidence · notes
#
# enforcement_level rationale: EVERY type ships at `advisory`. It graduates to `warn`
# then `block` when that type's finding baseline reaches zero. That is DECISIONS D3's
# whole point — a gate that blocks every PR on day one is switched off within a day.
# Types marked `enforcement_target:` name where they are expected to land.

types:

  # ───────────────────────────── L1/L2: brief and domain ─────────────────────
  product-brief:
    namespace_status: path_missing
    family: spec
    profile: core
    shape: document
    authority: authored
    key: [project]
    path_registry_type: null
    required+: []
    enums: {status: status, level: level, producer: producer}
    links: {inputs: inputs}
    sections: [Problem Statement, Target Users, Success Criteria, Constraints, Out of Scope]
    section_policy: expected
    gate_severity: error
    enforcement_level: advisory
    enforcement_target: block
    evidence: "template product-brief-template.md; 1 file in prism, 0 in vsdd/rivetry as a typed doc"
    notes: >
      Singleton per project. The `key` is the project, so there is exactly one row and
      its history IS the brief's evolution — the case delta-archive was hand-rolling.

  domain-spec:
    family: spec
    profile: core
    shape: document
    authority: authored
    key: [project]
