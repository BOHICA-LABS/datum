    links: {previous_review: previous_review, story_id: story_id, traces_to: traces_to}
    sections: [Summary, Findings, Novelty Assessment]
    section_policy: expected
    gate_severity: error
    enforcement_level: advisory
    enforcement_target: warn
    evidence: >
      n=725 canonical (vsdd 256 · prism 469) PLUS 425 files under 11 non-canonical
      spellings: adversarial-review-pass 156, adversary-review 73, adversary-pass-report
      63, adversarial-review-report 46, adversarial-pass-report 42, adversary-pass 21,
      pr-adversary-pass-report 8, pr-level-pr-reviewer-review 8, local-adversary-review 6,
      per-story-adversary-review 6, adversary-report 4, adversarial-review-rejected 1.
      Canonical `adversarial-review` appears in 64 plugin files vs `adversary-review` in 1.
    notes: >
      MEASURED CAUTION: only `document_type` itself is present in >=95% of today's 725
      canonical files. Every one of the 8 required+ fields is therefore a TIGHTENING that
      most existing files will fail — which is precisely why this type ships `advisory`
      with a dated baseline and targets `warn`, not `block`. Section-scoped semantics
      matter here and are why D-A stores an addressable section partition: `finding_count:
      0` is CORRECT in a document whose `### O-001` headings sit under "Part B —
      Observations (non-finding)", so a naive body-wide finding count manufactures a
      false finding.

