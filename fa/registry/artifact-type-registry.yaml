# ═══════════════════════════════════════════════════════════════════════════════
# RETIRED — types that exist only because there is no versioned store
# ═══════════════════════════════════════════════════════════════════════════════
# Migration DELETES these after verifying the store carries the same information. They
# are listed rather than omitted so the deletion is a declared, reviewable decision and
# not a silent data loss.

retired_types:

  delta-archive:
    shape: document
    authority: retired
    evidence: >
      211 FILES — rivetry's single largest document_type, larger than its
      behavioral-contract count (151). `*.DELTA-ARCHIVE.md` sidecars carrying
      source_file + source_document_type + created, spread over specs/verification-properties
      (50), specs/architecture/decisions (18), specs/ux/screens (17),
      specs/behavioral-contracts/ss-* (48+), specs/domain-spec (13) and design-system (3).
    generated_by: >
      rivetry's own POLICY-22 "de-bloat" rotation. The files say so: "[Moved verbatim from
      the live delta, pass-111 v1.15 burst, POLICY-22 de-bloat.]" and "[Archived from live
      delta at v1.16, pass-111 remediation close D-198, per POLICY-22.]"
    replaced_by: dolt_history_* on the source artifact's own key
    migration: >
      Each archive entry is a version of its `source_file`. Load entries as historical
      versions of that key, verify the reconstructed sequence, THEN delete. The archive is
      the only place some of those versions exist, so this is a data-bearing migration and
      must be gated by a count assertion, not assumed.
    why_this_is_the_headline: >
      A project independently invented file-level version history, a rotation policy to
      manage it, and a lint to check the rotation — inside markdown, because the store had
      no history. It is the most direct measured argument for the whole vision, and it was
      found by measurement, not by reading the standard.

  input-hash:
    shape: null
    authority: retired
    kind: field_not_type
    evidence: "3,890 files carry it: vsdd 2,347 · prism 990 · rivetry 553. Declared by 34 of 79 templates."
    replaced_by: derived staleness from `inputs` + store history
    migration: "Drop the field. Nothing reads it that fa cannot compute."
    why: >
      It is a hand-maintained content hash of an artifact's declared inputs, and the corpus
      documents its own failure mode verbatim: "Any future burst that refreshes risks.md's
      or failure-modes.md's own input-hash will make this file's stored 93aec96 show as
      spurious DRIFT even though the substantive classification content is unchanged."
      Plus a `PENDING-RECOMPUTE` sentinel appears throughout, i.e. the field is routinely
      knowingly wrong. A derived hash cannot be stale and cannot cascade.

  rotation_archive_variants:
    shape: null
    authority: retired
    kind: family
    members: [decisions-archive, lessons-archive, session-checkpoints-archive, decisions-log-archive, adversarial-review-cascade-summary]
    evidence: "13 files across the three corpora"
    replaced_by: "append-only-event rows + a query with a date bound"
    why: >
      Every one exists because a live ledger file grew too large to keep editing. With rows
      there is nothing to rotate, so both the archive files AND the rotation policies that
      created them stop existing. Same root cause as delta-archive, one level up.

  verdict:
    shape: null
    authority: retired
    kind: field_not_type
    evidence: "vsdd 476 values across 14 spellings · prism 348 across 14 · rivetry 8 (2 of them free prose). ZERO values shared between vsdd and prism."
    replaced_by: "gate_result + convergence + severity_max (D-D, enums.yaml)"
