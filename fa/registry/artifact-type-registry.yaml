# ═══════════════════════════════════════════════════════════════════════════════
# GAPS — real concepts with real mass and NO canonical type
# ═══════════════════════════════════════════════════════════════════════════════
# These are the honest counter-evidence to "the standard already exists". Each is a
# concept in active use that the 81 template-declared values do not cover, so it cannot
# be aliased — it must ENTER THE STANDARD by adding a template (classification rule 3).
# Until a template exists these rows are `pending_template: true` and gate at `info`:
# gating a project for using a concept the standard forgot would be the registry's own
# defect, not the project's.
#
# Total gap mass: 344 files. That is 30% of the 1,138 non-canonical files, and it is why
# this task was a design task and not only an enforcement task.

gap_types:

  fix-burst-closure:
    profile: core
    shape: document
    authority: authored
    key: [cycle, target, burst_number]
    required+: [target_artifact, findings_closed, findings_total, findings_deferred, burst_number]
    optional+: [closure_date, base_sha, target_sha, branch, worktree, test_result, implementer_agent]
    enums: {status: status, gate_result: gate_result, producer: producer}
    links: {story_id: story_id}
    sections: [Summary, Per-Finding Closure Table, Streak Status, Next Action]
    section_policy: expected
    gate_severity: warn
    enforcement_level: advisory
    pending_template: true
    evidence: >
      79 FILES ACROSS 7 SPELLINGS, ALL prism: fix-burst-closure-report 37,
      fix-burst-closure 17, fix-burst-closure-record 11, fix-pass-closure-report 6,
      fix-burst-report 5, fix-burst-record 2, fix-burst-plan 1 (vsdd). The single largest
      undeclared concept in any corpus.
    notes: >
      The `fix` template exists but is a different artifact (a plan, not a closure record).
      findings_closed / findings_total / findings_deferred become DERIVED once
      adversarial-finding rows exist — which is the strongest argument for minting that
      unused type first.

  remediation-manifest:
    profile: core
    shape: document
    authority: authored
    key: [cycle, wave, seq]
    required+: []
    enums: {status: status, producer: producer}
    sections: [Summary, Manifest Table, Files Modified, Next Steps]
    section_policy: expected
    gate_severity: warn
    enforcement_level: advisory
    pending_template: true
    evidence: "31 files, prism only, + 1 `remediation-log` + 1 `drift-items-resolved` + 1 `drift-items-deferred`"

  wave-gate-report:
    profile: core
    shape: document
    authority: authored
    key: [wave_id, gate_step, pass]
    required+: [wave_id, gate_result]
    optional+: [gate_step, gate_step_name, pass, final_develop_head, gate_date]
    enums: {status: status, gate_result: gate_result, severity_max: severity_max, convergence: convergence, producer: producer}
    sections: [Summary, Gate Verdict Summary, Convergence Window Status]
    section_policy: expected
    gate_severity: error
    enforcement_level: advisory
    pending_template: true
    evidence: >
      30 files across 5 spellings, prism + vsdd: gate-step-report 21, pr-adversary-pass-report
      is separate, gate-step-f-holdout-evaluation 6, wave-gate-report 3,
      wave-gate-final-verdict 1, wave-gate-compensating-controls 1, gate-convergence-report 1.
    notes: >
      THIS IS WHERE `gate` AS AN IDENTIFIER LIVES — prism's `gate: wave-3-integration-gate`
      with `gate_step: e` and `gate_step_name: consistency-validation`, 40 files. Which is
      exactly why the outcome field had to be named `gate_result` (D-D).

  proposed-adr:
    profile: core
    shape: document
    authority: authored
    key: [proposal_slug]
    required+: [do_not_execute]
    enums: {status: status, producer: producer}
    sections: [Context, Decision Ledger, Alternatives Considered and Rejected, Honest Costs, Ripple Effects]
    section_policy: expected
    gate_severity: warn
    enforcement_level: advisory
    pending_template: true
    evidence: "28 prism files (ADR-PROP-*.md) + 1 `adr-amendment`; `do_not_execute` present on all 28"
    notes: >
      A pre-ADR that must NOT be mistaken for an accepted decision — `do_not_execute` is
      load-bearing. Alternative disposition: `adr` with status: draft. Recorded as a real
      choice rather than settled unilaterally, because 28 files depend on the distinction
      being visible.

  research-note:
    profile: core
    shape: document
    authority: ingested
    key: [topic, research_date]
    required+: []
    enums: {status: status, producer: producer}
